  "shell-quote@^1": "1.11.0"
  "body-parser@^1": "1.20.9"
  "qs@^6": "6.16.1"
  "@grpc/grpc-js@^1": "1.14.5"
  "@fastify/busboy@^3": "3.2.2"
  "postcss@^8": "8.5.23"
  "brace-expansion@^1": "1.1.21"
  "brace-expansion@^2": "2.1.7"
  "brace-expansion@^5": "5.0.12"
  "undici@^6": "6.29.1"
  "js-yaml@^3": "3.15.2"
  "js-yaml@^4": "4.3.2"
  "nanoid@^3": "3.3.18"
  "tar@^7": "7.5.21"
  "browserslist@^4": "4.28.7"
  "@xmldom/xmldom@^0.8": "0.8.15"
  "@xmldom/xmldom@^0.9": "0.9.12"
  "baseline-browser-mapping@^2": "2.11.0"
